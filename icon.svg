<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2FA8C0"/>
      <stop offset="100%" stop-color="#014A5E"/>
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- Subtle outer ring -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Inner compass face -->
  <circle cx="64" cy="64" r="38" fill="rgba(0,0,0,0.18)"/>

  <!-- Cardinal tick marks -->
  <line x1="64" y1="26" x2="64" y2="30" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
  <line x1="102" y1="64" x2="98" y2="64" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="102" x2="64" y2="98" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="64" x2="30" y2="64" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- N needle (red) — points upper-right to suggest NE bearing -->
  <polygon points="64,28 68.5,64 59.5,64" fill="#FF5A5A" filter="url(#shadow)"/>
  <!-- S needle (white, faded) -->
  <polygon points="64,100 68.5,64 59.5,64" fill="rgba(255,255,255,0.45)"/>

  <!-- E needle (white, subtle) -->
  <polygon points="100,64 64,68.5 64,59.5" fill="rgba(255,255,255,0.3)"/>
  <!-- W needle (white, subtle) -->
  <polygon points="28,64 64,68.5 64,59.5" fill="rgba(255,255,255,0.15)"/>

  <!-- Center pivot -->
  <circle cx="64" cy="64" r="7" fill="white" filter="url(#shadow)"/>
  <circle cx="64" cy="64" r="3.5" fill="#01647E"/>

  <!-- N label -->
  <text x="64" y="21" text-anchor="middle" font-family="Helvetica Neue,Helvetica,sans-serif" font-size="10" font-weight="700" fill="white" opacity="0.9">N</text>
</svg>
